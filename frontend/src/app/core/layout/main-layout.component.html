<mat-sidenav-container class="layout-container">
  <mat-sidenav
    #drawer
    [opened]="true"
    mode="side"
    class="sidenav"
    fixedInViewport
    [attr.role]="'navigation'"
  >
    <div class="sidenav-header">
      <span class="sidenav-title">CFlow</span>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/home" routerLinkActive="active" (click)="closeSidenavIfHandset()">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Início</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content class="layout-content">
    <mat-toolbar color="primary" class="main-toolbar">
      <button mat-icon-button (click)="sidenav.toggle()" aria-label="Abrir/fechar menu">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">CFlow</span>
      <span class="spacer"></span>
      <button mat-icon-button (click)="logout()" aria-label="Sair">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
